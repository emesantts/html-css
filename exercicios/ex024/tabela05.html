<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabela</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
      }
      table{
        border-collapse: collapse;
      }

      caption{
        font-size: 1.3em;
        font-weight: bold;
        padding: 10px;
      }

      th,td{
        border: 1px solid, grey;
        padding: 10px;
      }
      .cnome{
        background-color: aqua;
      }
      col.cgrupo{
        background-color: rgb(255, 162, 0);
      }
    </style>
</head>
<body>
    <h1>Exercicio de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>
      <caption>Catrasdo</caption>
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
      </tr>
      <tr>
        <td>Ana Maria</td>
        <td>F</td>
        <td>30</td>
        <td>Professora</td>
      </tr>
      <tr>
        <td>Bruno Mendonça</td>
        <td>M</td>
        <td>40</td>
        <td>Médico</td>
      </tr>
      <tr>
        <td>Alice Queiroz</td>
        <td>F</td>
        <td>25</td>
        <td>Cozinheira</td>
      </tr>
      <tr>
        <td>Gutavo Guanabara</td>
        <td>M</td>
        <td>45</td>
        <td>Programador</td>
      </tr>
      <tr>
        <td>Fernando</td>
        <td>M</td>
        <td>32</td>
        <td>Pastor</td>
      </tr>
      <tr>
        <td>Carol Araujo</td>
        <td>F</td>
        <td>23</td>
        <td>Cantora</td>
      </tr>
    </table>
</body>
</html>
